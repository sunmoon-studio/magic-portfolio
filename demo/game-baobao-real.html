        createButton('pfire', GW - 55, 55, 45, 45, '射', '#993C1D');
        createButton('wswitch', GW - 55, 105, 45, 35, '换', '#5DCAA5');
        createButton('usecookie', GW - 55, 145, 45, 35, '饼', '#F5C4B3');
        createButton('usemocha', GW - 55, 185, 45, 35, '爪', '#1D9E75');
    },

    showDialogue(text, duration) {
        this.currentDialogue = { text, duration };
        this.dialogueTimer = duration;
    },

    update(dt) {
        if (shopOpen) return;
        if (this.completed || this.failed) {
            updateFade(dt);
            return;
        }
        this.frame++;
        this.sunTimer -= dt;
        if (this.sunTimer <= 0) {
            this.sun += 25;
            this.sunTimer = 5;
        }
        for (let i = 0; i < this.turretTypes.length; i++) {
            if (input['turret_' + i]) {
                input['turret_' + i] = false;
                const t = this.turretTypes[i];
                if (this.sun >= t.cost) {
                    this.selectedTurret = i;
                    this.showDialogue('选中：' + t.name + '（' + t.cost + '阳光）点击网格放置', 2);
                } else {
                    this.showDialogue('阳光不够！需要 ' + t.cost, 1.5);
                }
            }
        }
        if (this.waveIndex < this.waves.length) {
            this.waveTimer -= dt;
            if (this.waveTimer <= 0) {
                this.spawnWave(this.waves[this.waveIndex]);
                this.waveIndex++;
                if (this.waveIndex < this.waves.length) {
                    this.waveTimer = this.waves[this.waveIndex].delay;
                }
            }
        }        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i];
            e.frame++;
            e.hurt = Math.max(0, e.hurt - dt);
            e.x -= e.speed * dt;
            if (e.x < 60) {
                this.baseHealth -= e.type === 'pigeon_king' ? 30 : 10;
                this.enemies.splice(i, 1);
                shake(5, 0.2);
                damageFlash = 0.3;
                spawnFloatingText(60, GH / 2, '-' + (e.type === 'pigeon_king' ? 30 : 10), '#E24B4A', 16);
                if (this.baseHealth <= 0) {
                    this.failed = true;
                    this.showDialogue('约会地点被攻破了！', 0);
                    AudioManager.gameOver();
                    var self = this;
                    setTimeout(() => fadeOut(() => changeScene('level2')), 2000);
                }
                continue;
            }
            if (e.health <= 0) {
                this.sun += e.type === 'pigeon_king' ? 100 : 15;
                gameData.score += e.type === 'pigeon_king' ? 500 : 30;
                spawnFloatingText(e.x, e.y, e.type === 'pigeon_king' ? '+100☀' : '+15☀', '#EF9F27', 13);
                for (let j = 0; j < 8; j++) {
                    spawnParticle(e.x, e.y, rand(-100, 100), rand(-150, -50), '#AFA9EC', 0.5, 3);
                }
                if (e.type === 'pigeon_king') {
                    this.bossDefeated = true;
                    shake(15, 0.5);
                    AudioManager.levelWin();
                    this.showDialogue('鸽王之王：咕……下次一定来！', 2.5);
                    var self2 = this;
                    setTimeout(() => {
                        if (!self2.completed) {
                            self2.completed = true;
                            gameData.level2Completed = true;
                            fadeOut(() => changeScene('ending'));
                        }
                    }, 2500);
                }
                this.enemies.splice(i, 1);
            }
        }
        for (const t of this.turrets) {
            t.frame++;
            t.cd = Math.max(0, t.cd - dt);
            if (t.type === 'copper_shield') continue;
            if (t.cd <= 0) {
                let target = null;
                let minDist = t.def.range;
                for (const e of this.enemies) {
                    const d = Math.abs(e.x - t.x);
                    if (d < minDist && Math.abs(e.y - t.y) < 50) {
                        minDist = d;
                        target = e;
                    }
                }
                if (target) {
                    t.cd = t.def.cd;
                    t.angle = Math.atan2(target.y - t.y, target.x - t.x);
                    this.projectiles.push({
                        x: t.x, y: t.y,
                        vx: Math.cos(t.angle) * 300,
                        vy: Math.sin(t.angle) * 300,
                        dmg: t.def.dmg,
                        type: t.type,
                        aoe: t.type === 'chicken_cannon' ? 60 : (t.type === 'duck_mine' ? 80 : 0),
                        life: 1.5
                    });
                    if (t.type === 'chicken_cannon') AudioManager.attack();
                    else if (t.type === 'duck_mine') AudioManager.turretFire();
                    else AudioManager.turretFire();
                }
            }
            let nearest = null, nd = Infinity;
            for (const e of this.enemies) {
                const d = Math.abs(e.x - t.x);
                if (d < nd && d < t.def.range) { nd = d; nearest = e; }
            }
            if (nearest) t.angle = Math.atan2(nearest.y - t.y, nearest.x - t.x);
        }
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const pr = this.projectiles[i];
            pr.x += pr.vx * dt;
            pr.y += pr.vy * dt;
            pr.life -= dt;
            if (pr.life <= 0 || pr.x < 0 || pr.x > GW) {
                this.projectiles.splice(i, 1);
                continue;
            }
            for (const e of this.enemies) {
                if (dist(pr.x, pr.y, e.x, e.y) < 20) {
                    if (pr.aoe > 0) {
                        for (const e2 of this.enemies) {
                            if (dist(pr.x, pr.y, e2.x, e2.y) < pr.aoe) {
                                e2.health -= pr.dmg;
                                e2.hurt = 0.2;
                            }
                        }
                        for (let j = 0; j < 10; j++) {
                            spawnParticle(pr.x, pr.y, rand(-150, 150), rand(-150, 150), '#EF9F27', 0.4, 4);
                        }
                    } else {
                        e.health -= pr.dmg;
                        e.hurt = 0.2;
                        spawnParticle(pr.x, pr.y, rand(-50, 50), rand(-50, 50), '#FFF', 0.2, 3);
                    }
                    this.projectiles.splice(i, 1);
                    break;
                }
            }
        }
        // ===== 玩家武器支援 =====
        this.playerShootCD = Math.max(0, this.playerShootCD - dt);
        if (input.pfire && this.playerShootCD <= 0) {
            const wDef = WEAPONS[gameData.currentWeapon] || WEAPONS.fist;
            if (wDef.type === 'ranged') {
                this.playerShootCD = wDef.cd;
                this.playerProjectiles.push({
                    x: 80, y: GH / 2,
                    vx: wDef.speed, vy: 0,
                    dmg: getAttackDamage(wDef.dmg), size: wDef.projSize,
                    color: wDef.color, aoe: wDef.aoe || 0, life: 2.0
                });
                AudioManager.turretFire();
            } else {
                this.playerShootCD = 0.5;
                for (const e of this.enemies) {
                    if (e.x < 150) {
                        e.health -= getAttackDamage(15);
                        e.hurt = 0.2;
                        spawnFloatingText(e.x, e.y - 15, '-' + 15, '#FFF', 12);
                    }
                }
                AudioManager.attack();
            }
        }
        // 玩家弹道更新
        for (let i = this.playerProjectiles.length - 1; i >= 0; i--) {
            const pr = this.playerProjectiles[i];
            pr.x += pr.vx * dt;
            pr.y += pr.vy * dt;
            pr.life -= dt;
            if (pr.life <= 0 || pr.x > GW) { this.playerProjectiles.splice(i, 1); continue; }
            for (const e of this.enemies) {
                if (Math.abs(pr.x - e.x) < e.w / 2 + pr.size && Math.abs(pr.y - e.y) < e.h / 2 + pr.size) {
                    e.health -= pr.dmg;
                    e.hurt = 0.2;
                    spawnFloatingText(e.x, e.y - e.h - 5, '-' + Math.round(pr.dmg), '#FFF', 12);
                    if (pr.aoe > 0) {
                        for (const e2 of this.enemies) {
                            if (e2 !== e && Math.hypot(e2.x - e.x, e2.y - e.y) < pr.aoe) {
                                e2.health -= pr.dmg * 0.5;
                                e2.hurt = 0.2;
                            }
                        }
                        for (let j = 0; j < 10; j++) spawnParticle(pr.x, pr.y, rand(-150, 150), rand(-150, 150), '#EF9F27', 0.4, 4);
                    }
                    this.playerProjectiles.splice(i, 1);
                    break;
                }
            }
        }
        // 无人机更新
        if (this.drone) {
            const d = this.drone;
            d.frame++;
            d.x += (100 - d.x) * 0.05;
            d.y += (GH / 2 - d.y) * 0.05;
            d.shootCD -= dt;
            if (d.shootCD <= 0) {
                let nearest = null, minDist = 400;
                for (const e of this.enemies) {
                    const dist = e.x - d.x;
                    if (dist > 0 && dist < minDist) { minDist = dist; nearest = e; }
                }
                if (nearest) {
                    d.shootCD = 0.8;
                    const dx = nearest.x - d.x;
                    const dy = nearest.y - d.y;
                    const dd = Math.hypot(dx, dy) || 1;
                    this.playerProjectiles.push({
                        x: d.x, y: d.y,
                        vx: dx / dd * 500, vy: dy / dd * 500,
                        dmg: getAttackDamage(12), size: 3,
                        color: '#5DCAA5', aoe: 0, life: 2.0
                    });
                    AudioManager.turretFire();
                }
            }
        }
        // 击杀掉币
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i];
            if (e.health <= 0 && !e._coinGiven) {
                e._coinGiven = true;
                var coinDrop = e.type === 'pigeon_king' ? 50 : randInt(5, 15);
                gameData.coins += coinDrop;
                spawnFloatingText(e.x, e.y - 25, '+' + coinDrop + '币', '#EF9F27', 11);
            }
        }
        if (this.currentDialogue) {
            this.dialogueTimer -= dt;
            if (this.dialogueTimer <= 0) this.currentDialogue = null;
        }
        updateParticles(dt);
        updateFloatingTexts(dt);
        damageFlash = Math.max(0, damageFlash - dt * 2);
        updateFade(dt);
    },

    spawnWave(wave) {
        for (const group of wave.enemies) {
            if (group.type === 'pigeon_king') {
                this.showDialogue('Boss 来了！鸽王之王！', 2);
            }
            for (let i = 0; i < group.count; i++) {
                var self = this;
                setTimeout(() => {
                    if (self.completed || self.failed) return;
                    self.spawnEnemy(group.type);
                }, i * group.gap * 1000);
            }
        }
    },

    spawnEnemy(type) {
        const row = randInt(0, this.gridRows - 1);
        const y = this.gridStartY + row * this.cellSize + this.cellSize / 2;
        const x = GW + 30;
        switch (type) {
            case 'nexttime':
                this.enemies.push({ type, x, y, w: 28, h: 24, speed: 40, health: 40, maxHealth: 40, hurt: 0, frame: 0 });
                break;
            case 'slime':
                this.enemies.push({ type, x, y, w: 24, h: 20, speed: 30, health: 70, maxHealth: 70, hurt: 0, frame: 0 });
                break;
            case 'toughguy':
                this.enemies.push({ type, x, y, w: 28, h: 36, speed: 25, health: 100, maxHealth: 100, hurt: 0, frame: 0 });
                break;
            case 'pigeon_king':
                this.enemies.push({ type, x, y: this.gridStartY + this.cellSize * 2, w: 50, h: 50, speed: 20, health: 500, maxHealth: 500, hurt: 0, frame: 0 });
                break;
        }
    },

    draw() {
        ctx.save();
        applyShake();
        drawStreetBackground(0);
        for (let r = 0; r < this.gridRows; r++) {
            for (let c = 0; c < this.gridCols; c++) {
                const x = this.gridStartX + c * this.cellSize;
                const y = this.gridStartY + r * this.cellSize;
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, this.cellSize, this.cellSize);
                if (this.selectedTurret !== null && this._hoverCol === c && this._hoverRow === r && !this.grid[r][c]) {
                    ctx.fillStyle = 'rgba(127, 119, 221, 0.2)';
                    ctx.fillRect(x, y, this.cellSize, this.cellSize);
                }
            }
        }
        ctx.fillStyle = 'rgba(228, 75, 74, 0.15)';
        ctx.fillRect(GW - 30, this.gridStartY, 30, this.gridRows * this.cellSize);
        ctx.fillStyle = '#E24B4A';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(GW - 15, this.gridStartY + this.gridRows * this.cellSize / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('爽约怪来啦', 0, 0);
        ctx.restore();
        ctx.fillStyle = 'rgba(93, 202, 165, 0.2)';
        ctx.fillRect(40, this.gridStartY, 80, this.gridRows * this.cellSize);
        ctx.fillStyle = '#5DCAA5';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(80, this.gridStartY + this.gridRows * this.cellSize / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('约会地点', 0, 0);
        ctx.restore();
        ctx.fillStyle = '#EF9F27';
        ctx.beginPath();
        ctx.arc(80, this.gridStartY + this.gridRows * this.cellSize / 2, 8, 0, Math.PI * 2);
        ctx.fill();
        for (const t of this.turrets) {
            drawTurret(t.type, t.x, t.y, t.frame, t.angle);
            if (t.type === 'copper_shield' && t.health < t.maxHealth) {
                ctx.fillStyle = '#333';
                ctx.fillRect(t.x - 16, t.y - 22, 32, 3);
                ctx.fillStyle = '#EF9F27';
                ctx.fillRect(t.x - 16, t.y - 22, 32 * (t.health / t.maxHealth), 3);
            }
        }
        for (const e of this.enemies) {
            switch (e.type) {
                case 'nexttime': drawNextTimeMonster(e.x, e.y, e.frame, e.hurt > 0); break;
                case 'slime': drawSlime(e.x, e.y, e.frame, e.hurt > 0); break;
                case 'toughguy': drawToughGuy(e.x, e.y, e.frame, e.hurt > 0); break;
                case 'pigeon_king': drawPigeonKing(e.x, e.y, e.frame, e.hurt > 0); break;
            }
            if (e.health < e.maxHealth) {
                const bw = e.type === 'pigeon_king' ? 50 : 30;
                ctx.fillStyle = '#333';
                ctx.fillRect(e.x - bw / 2, e.y - e.h - 8, bw, 4);
                ctx.fillStyle = '#E24B4A';
                ctx.fillRect(e.x - bw / 2, e.y - e.h - 8, bw * (e.health / e.maxHealth), 4);
            }
        }
        for (const pr of this.projectiles) {
            ctx.save();
            if (pr.type === 'mocha_turret') {
                ctx.fillStyle = '#1D9E75';
                ctx.beginPath();
                ctx.arc(pr.x, pr.y, 5, 0, Math.PI * 2);
                ctx.fill();
            } else if (pr.type === 'chicken_cannon') {
                ctx.fillStyle = '#F5C4B3';
                ctx.fillRect(pr.x - 4, pr.y - 4, 8, 8);
            }
            ctx.restore();
        }
        // 玩家弹道绘制
        for (const pr of this.playerProjectiles) {
            ctx.fillStyle = pr.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = pr.color;
            ctx.beginPath();
            ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        // 无人机绘制
        if (this.drone) {
            const d = this.drone;
            ctx.fillStyle = '#5DCAA5';
            ctx.beginPath();
            ctx.ellipse(d.x, d.y, 10, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            const ra = (d.frame * 0.8) % (Math.PI * 2);
            ctx.beginPath();
            ctx.moveTo(d.x - 8 + Math.cos(ra) * 4, d.y - 5);
            ctx.lineTo(d.x - 8 - Math.cos(ra) * 4, d.y - 5);
            ctx.moveTo(d.x + 8 + Math.cos(ra) * 4, d.y - 5);
            ctx.lineTo(d.x + 8 - Math.cos(ra) * 4, d.y - 5);
            ctx.stroke();
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(d.x, d.y + 2, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(d.x, d.y + 2, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
        drawParticles(0);
        drawFloatingTexts(0);
        ctx.restore();
        this.drawHUD();
        this.drawSelector();
        drawVirtualButtons();
        if (this.currentDialogue) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            roundRect(GW / 2 - 180, GH - 80, 360, 35, 8);
            ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.currentDialogue.text, GW / 2, GH - 62);
        }
        var boss = this.enemies.find(e => e.type === 'pigeon_king');
        if (boss) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(GW / 2 - 150, 15, 300, 20);
            ctx.fillStyle = '#E24B4A';
            ctx.fillRect(GW / 2 - 148, 17, 296 * (boss.health / boss.maxHealth), 16);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('鸽王之王', GW / 2, 18);
        }
        if (this.failed) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, GW, GH);
            ctx.fillStyle = '#E24B4A';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('约会地点被攻破了！', GW / 2, GH / 2);
            ctx.fillStyle = '#FFF';
            ctx.font = '14px sans-serif';
            ctx.fillText('重新挑战...', GW / 2, GH / 2 + 30);
        }
        if (damageFlash > 0) {
            ctx.fillStyle = 'rgba(226,75,74,' + (damageFlash * 0.4) + ')';
            ctx.fillRect(0, 0, GW, GH);
        }
        drawFade();
        if (shopOpen) drawShop();
    },

    drawHUD() {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(10, 10, 100, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#EF9F27';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('☀ ' + Math.floor(this.sun), 18, 22);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(120, 10, 140, 24, 6);
        ctx.fill();
        ctx.fillStyle = this.baseHealth > 50 ? '#5DCAA5' : '#E24B4A';
        roundRect(122, 12, 136 * (this.baseHealth / 100), 20, 4);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('约会 ' + this.baseHealth + '/100', 128, 22);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(270, 10, 100, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#AFA9EC';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('波次 ' + Math.min(this.waveIndex + 1, this.waves.length) + '/' + this.waves.length, 278, 22);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(380, 10, 90, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#EF9F27';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('得分 ' + gameData.score, 388, 22);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(480, 10, 90, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#AFA9EC';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('♪ ' + gameData.songFragments + '/' + gameData.totalFragments, 488, 22);
        // 金币
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(580, 10, 80, 24, 6);
        ctx.fill();
        ctx.fillStyle = '#EF9F27';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('币 ' + gameData.coins, 587, 22);
        if (this.sun >= 200) {
            ctx.fillStyle = 'rgba(239, 159, 39, 0.3)';
            roundRect(670, 10, 80, 24, 6);
            ctx.fill();
            ctx.fillStyle = '#EF9F27';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('666 清屏(200)', 710, 22);
        }
    },

    drawSelector() {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(10, GH - 60, GW - 20, 55, 8);
        ctx.fill();
        if (this.selectedTurret !== null) {
            ctx.strokeStyle = '#EF9F27';
            ctx.lineWidth = 2;
            roundRect(20 + this.selectedTurret * 75 - 2, GH - 57, 74, 54, 6);
            ctx.stroke();
        }
        drawVirtualButtons();
        for (let i = 0; i < this.turretTypes.length; i++) {
            const t = this.turretTypes[i];
            const x = 20 + i * 75;
            ctx.fillStyle = this.sun >= t.cost ? '#EF9F27' : '#E24B4A';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('☀' + t.cost, x + 35, GH - 12);
        }
    },

    handleClick(x, y) {
        // 商店开启时，所有点击交给商店处理
        if (shopOpen) {
            handleShopClick(x, y);
            return;
        }
        // 静音按钮
        if (x >= GW - 50 && x <= GW - 10 && y >= 10 && y <= 50) {
            AudioManager.toggleMute();
            AudioManager.click();
            return;
        }
        // 商店按钮
        if (x >= GW - 95 && x <= GW - 55 && y >= 10 && y <= 50) {
            shopOpen = true;
            AudioManager.click();
            return;
        }
        // 武器切换
        if (x >= GW - 55 && x <= GW - 10 && y >= 105 && y <= 140) {
            switchWeapon();
            return;
        }
        // 使用饼干
        if (x >= GW - 55 && x <= GW - 10 && y >= 145 && y <= 180) {
            if (useConsumable('cookie')) {
                this.baseHealth = Math.min(100, this.baseHealth + 20);
                spawnFloatingText(80, GH / 2, '+20HP', '#5DCAA5', 14);
            }
            return;
        }
        // 使用魔爪
        if (x >= GW - 55 && x <= GW - 10 && y >= 185 && y <= 220) {
            if (useConsumable('mocha')) {
                // Level2 加速：所有炮台射速提升
                for (const t of this.turrets) t.cd = 0;
                spawnFloatingText(GW / 2, GH / 2, '炮台加速!', '#1D9E75', 14);
            }
            return;
        }
        if (x >= 670 && x <= 750 && y >= 10 && y <= 34 && this.sun >= 200) {
            this.sun -= 200;
            for (const e of this.enemies) {
                e.health -= 60;
                e.hurt = 0.3;
            }
            shake(10, 0.4);
            AudioManager.big666();
            for (let i = 0; i < 20; i++) {
                spawnParticle(rand(100, GW - 100), rand(100, GH - 100), rand(-200, 200), rand(-200, 200), '#EF9F27', 0.6, 5);
            }
            this.showDialogue('6666！！！全屏攻击！', 1.5);
            return;
        }
        // 射击按钮
        if (x >= GW - 55 && x <= GW - 10 && y >= 55 && y <= 100) {
            input.pfire = true;
            setTimeout(() => { input.pfire = false; }, 100);
            return;
        }
        for (let i = 0; i < this.turretTypes.length; i++) {
            const btn = virtualButtons['turret_' + i];
            if (btn && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                const t = this.turretTypes[i];
                if (this.sun >= t.cost) {
                    this.selectedTurret = i;
                    this.showDialogue('选中：' + t.name + '（' + t.cost + '阳光）', 2);
                } else {
                    this.showDialogue('阳光不够！需要 ' + t.cost, 1.5);
                }
                return;
            }
        }
        if (this.selectedTurret !== null) {
            const col = Math.floor((x - this.gridStartX) / this.cellSize);
            const row = Math.floor((y - this.gridStartY) / this.cellSize);
            if (col >= 0 && col < this.gridCols && row >= 0 && row < this.gridRows && !this.grid[row][col]) {
                const def = this.turretTypes[this.selectedTurret];
                if (this.sun >= def.cost) {
                    this.sun -= def.cost;
                    const tx = this.gridStartX + col * this.cellSize + this.cellSize / 2;
                    const ty = this.gridStartY + row * this.cellSize + this.cellSize / 2;
                    const turret = {
                        type: def.type, x: tx, y: ty,
                        row, col, def, cd: 0, angle: 0, frame: 0,
                        health: def.type === 'copper_shield' ? 300 : 50,
                        maxHealth: def.type === 'copper_shield' ? 300 : 50
                    };
                    this.grid[row][col] = turret;
                    this.turrets.push(turret);
                    this.selectedTurret = null;
                    this.showDialogue('已放置：' + def.name, 1);
                    AudioManager.placeTurret();
                }
            }
        }
    },

    handleMove(x, y) {
        this._hoverCol = Math.floor((x - this.gridStartX) / this.cellSize);
        this._hoverRow = Math.floor((y - this.gridStartY) / this.cellSize);
    }
};
scenes.level2 = Level2Scene;

// ==================== ending.js ====================
const EndingScene = {
    frame: 0,
    phase: 0,
    phaseTimer: 0,
    fistY: 100,
    lyricsAlpha: 0,
    lyricsIndex: 0,
    lyricsTimer: 0,
    finalAlpha: 0,
    particles: [],

    lyrics: [
        '那个五月 你说"来 我教你"',
        '一转眼 一百多个日夜了',
        '你的6666 我都背下来了',
        '你一嘴硬 我还是想笑',
        '',
        '但故事不会停在"认识你一年"',
        '往后的日子还长',
        '还有更多的6666 要一起喊',
        '还有更多的嘴硬 要一起拆穿',
    ],

    init() {
        this.frame = 0;
        this.phase = 0;
        this.phaseTimer = 0;
        this.fistY = -50;
        this.lyricsAlpha = 0;
        this.lyricsIndex = 0;
        this.lyricsTimer = 0;
        this.finalAlpha = 0;
        this.particles = [];
        AudioManager.stopBGM();
        AudioManager.levelWin();
    },

    update(dt) {
        this.frame++;
        this.phaseTimer += dt;
        switch (this.phase) {
            case 0:
                if (this.phaseTimer > 1) {
                    this.phase = 1;
                    this.phaseTimer = 0;
                }
                break;
            case 1:
                this.fistY = lerp(this.fistY, GH / 2 + 20, 0.04);
                if (this.phaseTimer > 2) {
                    if (this.phaseTimer < 2.1) {
                        shake(8, 0.3);
                        AudioManager.fistBump();
                        for (let i = 0; i < 30; i++) {
                            this.particles.push({
                                x: GW / 2, y: GH / 2 + 20,
                                vx: rand(-200, 200), vy: rand(-200, 200),
                                life: 1, size: rand(3, 6),
                                color: ['#EF9F27', '#AFA9EC', '#5DCAA5', '#F0997B'][randInt(0, 3)]
                            });
                        }
                    }
                    if (this.phaseTimer > 3) {
                        this.phase = 2;
                        this.phaseTimer = 0;
                    }
                }
                break;
            case 2:
                this.lyricsAlpha = lerp(this.lyricsAlpha, 1, 0.05);
                this.lyricsTimer += dt;
                if (this.lyricsTimer > 1.8) {
                    this.lyricsTimer = 0;
                    this.lyricsIndex++;
                    if (this.lyricsIndex >= this.lyrics.length) {
                        this.phase = 3;
                        this.phaseTimer = 0;
                    }
                }
                break;
            case 3:
                this.finalAlpha = lerp(this.finalAlpha, 1, 0.03);
                if (this.phaseTimer > 5) {
                    if (input.jump || input.attack || input.touching) {
                        fadeOut(() => changeScene('menu'));
                    }
                }
                break;
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 100 * dt;
            p.life -= dt;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
        if (this.frame % 5 === 0) {
            this.particles.push({
                x: rand(0, GW), y: GH + 10,
                vx: rand(-20, 20), vy: rand(-40, -20),
                life: 4, size: rand(2, 4),
                color: 'rgba(175, 169, 236, 0.6)'
            });
        }
        updateFade(dt);
    },

    draw() {
        const grad = ctx.createLinearGradient(0, 0, 0, GH);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(0.5, '#2a2a4e');
        grad.addColorStop(1, '#1a1a3e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GW, GH);
        ctx.save();
        const sunGrad = ctx.createRadialGradient(GW / 2, -50, 0, GW / 2, -50, 300);
        sunGrad.addColorStop(0, 'rgba(239, 159, 39, 0.15)');
        sunGrad.addColorStop(1, 'rgba(239, 159, 39, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, GW, GH);
        ctx.restore();
        for (const p of this.particles) {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.restore();
        }
        if (this.phase >= 1) {
            this.drawFistBump();
        }
        if (this.phase >= 2) {
            ctx.save();
            ctx.globalAlpha = this.lyricsAlpha;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i <= this.lyricsIndex && i < this.lyrics.length; i++) {
                const line = this.lyrics[i];
                if (!line) continue;
                const y = 55 + i * 26;
                const alpha = i === this.lyricsIndex ? 1 : 0.4;
                ctx.globalAlpha = this.lyricsAlpha * alpha;
                ctx.fillStyle = '#EEEDFE';
                ctx.font = i === this.lyricsIndex ? 'bold 15px sans-serif' : '13px sans-serif';
                ctx.fillText(line, GW / 2, y);
            }
            ctx.restore();
        }
        if (this.phase >= 3) {
            ctx.save();
            ctx.globalAlpha = this.finalAlpha;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#888780';
            ctx.font = '18px sans-serif';
            ctx.fillText('下次一定？', GW / 2, GH - 130);
            ctx.fillStyle = '#5DCAA5';
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText('这次，一定！', GW / 2, GH - 95);
            ctx.globalAlpha = this.finalAlpha * (Math.sin(this.frame * 0.05) * 0.3 + 0.7);
            ctx.fillStyle = '#888780';
            ctx.font = '12px sans-serif';
            ctx.fillText('点击屏幕重新开始', GW / 2, GH - 30);
            ctx.restore();
        }
        if (this.phase === 0 && gameData.songFragments >= gameData.totalFragments) {
            ctx.fillStyle = '#AFA9EC';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('★ 隐藏结局已解锁 ★', GW / 2, 30);
        }
        drawFade();
    },

    drawFistBump() {
        const y = this.fistY;
        const cx = GW / 2;
        ctx.save();
        ctx.fillStyle = '#F5C4B3';
        ctx.beginPath();
        ctx.arc(cx - 30, y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#E0997B';
        ctx.beginPath();
        ctx.arc(cx - 38, y - 8, 5, 0, Math.PI * 2);
        ctx.arc(cx - 42, y - 2, 5, 0, Math.PI * 2);
        ctx.arc(cx - 42, y + 6, 5, 0, Math.PI * 2);
        ctx.arc(cx - 38, y + 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.fillStyle = '#F5C4B3';
        ctx.beginPath();
        ctx.arc(cx + 30, y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#E0997B';
        ctx.beginPath();
        ctx.arc(cx + 38, y - 8, 5, 0, Math.PI * 2);
        ctx.arc(cx + 42, y - 2, 5, 0, Math.PI * 2);
        ctx.arc(cx + 42, y + 6, 5, 0, Math.PI * 2);
        ctx.arc(cx + 38, y + 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        if (this.phase === 1 && this.phaseTimer > 1.8) {
            ctx.save();
            ctx.globalAlpha = 1 - (this.phaseTimer - 1.8) / 1.2;
            ctx.strokeStyle = '#EF9F27';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, y, 25 + (this.phaseTimer - 1.8) * 50, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        if (this.phase >= 1 && this.phaseTimer > 0.5) {
            ctx.fillStyle = '#888780';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('豆宝', cx - 30, y + 40);
            ctx.fillText('朋友', cx + 30, y + 40);
        }
    },

    handleClick(x, y) {
        if (this.phase >= 3 && this.phaseTimer > 3) {
            fadeOut(() => changeScene('menu'));
        }
    }
};
scenes.ending = EndingScene;

// ==================== main.js ====================
function bootstrap() {
    bootLog('🚀 bootstrap() 开始', '#EF9F27');
    try {
        bootLog('  → initCanvas()', '#AFA9EC');
        if (!initCanvas()) {
            bootLog('  ✗ initCanvas 失败', '#ff6b6b');
            return;
        }
        bootLog('  → AudioManager.init()', '#AFA9EC');
        AudioManager.init();
        bootLog('  → bindEvents()', '#AFA9EC');
        bindEvents();
        bootLog('  → changeScene(menu)', '#AFA9EC');
        if (scenes.menu) {
            changeScene('menu');
            bootLog('  ✓ 进入菜单场景', '#5DCAA5');
        } else {
            bootLog('  ✗ 找不到 menu', '#ff6b6b');
            showError('场景错误', '找不到 menu 场景，请刷新页面重试');
            return;
        }
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });
        setTimeout(function() { window.scrollTo(0, 1); }, 0);
        bootLog('🎮 启动完成！');
        var fb = document.getElementById('staticFallback');
        if (fb) fb.remove();
    } catch (err) {
        bootLog('💥 启动异常: ' + err.message, '#ff6b6b');
        showError('启动错误', err.message + '\n\n' + (err.stack || ''));
    }
}

function bindEvents() {
    // PointerEvents（首选，兼容 mouse 和 touch）
    if (window.PointerEvent) {
        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointermove', handlePointerMove);
    } else {
        // 退化到 touch + mouse
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('mousedown', e => {
            AudioManager.resume();
            const rx = (e.clientX - offsetX) / scale;
            const ry = (e.clientY - offsetY) / scale;
            for (const id in virtualButtons) {
                const btn = virtualButtons[id];
                if (rx >= btn.x && rx <= btn.x + btn.w && ry >= btn.y && ry <= btn.y + btn.h) {
                    btn.pressed = true;
                    if (input.hasOwnProperty(id)) input[id] = true;
                }
            }
            if (currentScene && currentScene.handleClick) {
                currentScene.handleClick(rx, ry);
            }
        });
        canvas.addEventListener('mouseup', e => {
            for (const id in virtualButtons) {
                virtualButtons[id].pressed = false;
                if (input.hasOwnProperty(id)) input[id] = false;
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (currentScene && currentScene.handleMove) {
                const rx = (e.clientX - offsetX) / scale;
                const ry = (e.clientY - offsetY) / scale;
                currentScene.handleMove(rx, ry);
            }
        });
    }
    canvas.addEventListener('contextmenu', handleContextMenu);

    // 第一次任意用户操作时激活音频
    document.addEventListener('touchstart', () => AudioManager.resume(), { once: true });
    document.addEventListener('mousedown', () => AudioManager.resume(), { once: true });
    document.addEventListener('keydown', () => AudioManager.resume(), { once: true });

    running = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', bootstrap);
} else {
    bootstrap();
}
window.addEventListener('load', function() {
    // 兜底：万一 DOMContentLoaded 没触发
    if (!running) bootstrap();
});
</script>
